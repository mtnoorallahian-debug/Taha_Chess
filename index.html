
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10151f">
<title>Taha Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px 12px 30px;background:#10151f;color:#f4f6fa;
 font-family:Tahoma,Arial,sans-serif;text-align:center
}
.app{max-width:480px;margin:auto}
h1{margin:5px;color:#d9edbd;font-size:29px}
.sub{color:#9baac0;font-size:13px;margin:8px 0 20px}
.top{
 display:flex;justify-content:space-between;align-items:center;gap:8px;
 background:#1b2432;padding:13px;border-radius:13px;margin-bottom:12px
}
#status{font-size:13px;text-align:right}
.tag{color:#c4e88d;font-size:11px;white-space:nowrap}
.board{
 display:grid;grid-template-columns:repeat(8,1fr);width:100%;
 aspect-ratio:1;border:5px solid #29374a;border-radius:8px;
 overflow:hidden;direction:ltr;box-shadow:0 12px 35px #0006
}
.square{
 border:0;margin:0;padding:0;position:relative;
 display:flex;align-items:center;justify-content:center;
 aspect-ratio:1;font-family:Arial,sans-serif;
 font-size:clamp(27px,8vw,45px);cursor:pointer;
 touch-action:manipulation;user-select:none
}
.light{background:#e7e2d4}
.dark{background:#748c7c}
.square.selected{background:#e8d36d!important}
.square.last{background:#baca65}
.square.hint:after{
 content:"";position:absolute;width:24%;height:24%;
 border-radius:50%;background:#253b348c
}
.square.capture:after{
 content:"";position:absolute;inset:3px;border:4px solid #b34d58;
 border-radius:50%
}
.piece.white{color:#fff;text-shadow:1px 2px 2px #222,0 0 2px #222}
.piece.black{color:#20242c;text-shadow:0 1px 1px #fff6}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
button.action,select{
 background:#263346;color:#f5f7fb;border:1px solid #3c4b60;
 padding:12px 8px;border-radius:11px;font-size:13px;cursor:pointer
}
button.action:active{transform:scale(.98)}
select{width:100%;margin-top:10px}
.history{margin-top:14px;background:#1b2432;border-radius:13px;padding:13px;text-align:right}
.history h3{margin:0 0 8px;font-size:13px;color:#d9edbd}
#moves{font-size:12px;color:#c1ccda;line-height:2;overflow-wrap:anywhere}
footer{color:#718096;font-size:11px;margin-top:18px}

/* پنجره انتخاب مهره */
.modal{
 display:none;position:fixed;inset:0;background:#000c;z-index:99;
 align-items:center;justify-content:center;padding:18px
}
.modal-card{
 background:#1b2432;border:1px solid #3b4c63;border-radius:20px;
 padding:22px 16px;width:100%;max-width:340px;
 box-shadow:0 15px 50px #0009
}
.modal-card h2{font-size:20px;color:#d9edbd;margin:0 0 9px}
.modal-card p{font-size:13px;color:#b9c6d7;line-height:1.8}
.promotion-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.promo-btn{
 background:#e7e2d4;color:#20242c;border:3px solid transparent;
 border-radius:12px;padding:8px 2px;cursor:pointer
}
.promo-btn:active{border-color:#b7f34a}
.promo-symbol{display:block;font-size:39px;line-height:1.2}
.promo-name{display:block;font-size:11px;margin-top:5px}
@media(min-width:500px){.square{font-size:44px}}
</style>
</head>
<body>
<div class="app">
 <h1>♟ TAHA CHESS</h1>
 <div class="sub">فکر کن، حرکت کن، برنده شو.</div>

 <div class="top">
  <div id="status">در حال آماده‌سازی...</div>
  <div class="tag">♛ CHESS ARENA</div>
 </div>

 <div class="board" id="board"></div>

 <div class="controls">
  <button class="action" id="undoBtn">↩️ برگشت حرکت</button>
  <button class="action" id="newBtn">🔄 بازی جدید</button>
 </div>

 <select id="mode">
  <option value="ai">🤖 بازی با کامپیوتر</option>
  <option value="two">👥 بازی دونفره</option>
 </select>

 <div class="history">
  <h3>📜 تاریخچه حرکات</h3>
  <div id="moves">هنوز حرکتی انجام نشده.</div>
 </div>

 <footer>TAHA CHESS · موفق باشی! ♟️</footer>
</div>

<!-- پنجره انتخاب مهره برای ارتقای سرباز -->
<div class="modal" id="promotionModal">
 <div class="modal-card">
  <h2>سربازت به آخر رسید! 🎉</h2>
  <p>انتخاب کن سربازت به چه مهره‌ای تبدیل بشه:</p>
  <div class="promotion-options">
   <button class="promo-btn" data-piece="q">
    <span class="promo-symbol" id="promoQ">♕</span>
    <span class="promo-name">وزیر</span>
   </button>
   <button class="promo-btn" data-piece="r">
    <span class="promo-symbol" id="promoR">♖</span>
    <span class="promo-name">رخ</span>
   </button>
   <button class="promo-btn" data-piece="b">
    <span class="promo-symbol" id="promoB">♗</span>
    <span class="promo-name">فیل</span>
   </button>
   <button class="promo-btn" data-piece="n">
    <span class="promo-symbol" id="promoN">♘</span>
    <span class="promo-name">اسب</span>
   </button>
  </div>
 </div>
</div>

<script>
(function(){
'use strict';

const boardEl=document.getElementById('board');
const statusEl=document.getElementById('status');
const movesEl=document.getElementById('moves');
const modal=document.getElementById('promotionModal');
const modeEl=document.getElementById('mode');

if(typeof Chess==='undefined'){
 statusEl.textContent='کتابخانه شطرنج بارگذاری نشد؛ اینترنت را بررسی کن.';
 boardEl.style.display='none';
 throw new Error('chess.js failed to load');
}

const game=new Chess();

const symbols={
 wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',
 bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'
};

let selected=null;
let targets=[];
let lastMove=null;
let thinking=false;
let pendingPromotion=null;
let gameToken=0;

function render(){
 boardEl.innerHTML='';
 const position=game.board();

 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   const square=String.fromCharCode(97+c)+(8-r);
   const piece=position[r][c];
   const cell=document.createElement('button');

   cell.className='square '+((r+c)%2===0?'light':'dark');
   cell.setAttribute('aria-label',square);

   if(lastMove&&(square===lastMove.from||square===lastMove.to)){
    cell.classList.add('last');
   }
   if(square===selected)cell.classList.add('selected');

   const target=targets.find(m=>m.to===square);
   if(target)cell.classList.add(piece?'capture':'hint');

   if(piece){
    const span=document.createElement('span');
    span.className='piece '+(piece.color==='w'?'white':'black');
    span.textContent=symbols[piece.color+piece.type];
    cell.appendChild(span);
   }

   cell.addEventListener('click',()=>tapSquare(square));
   boardEl.appendChild(cell);
  }
 }
 updateStatus();
 updateHistory();
}

function updateStatus(){
 if(game.in_checkmate()){
  statusEl.textContent='مات! '+(game.turn()==='w'?'سیاه':'سفید')+' برنده شد 🏆';
 }else if(game.in_draw()){
  statusEl.textContent='بازی مساوی شد 🤝';
 }else if(game.in_check()){
  statusEl.textContent='کیش! نوبت '+(game.turn()==='w'?'سفید':'سیاه');
 }else if(thinking){
  statusEl.textContent='کامپیوتر فکر می‌کند...';
 }else{
  statusEl.textContent='نوبت '+(game.turn()==='w'?'سفید ⚪':'سیاه ⚫');
 }
}

function updateHistory(){
 const history=game.history();
 if(!history.length){
  movesEl.textContent='هنوز حرکتی انجام نشده.';
  return;
 }
 const rows=[];
 for(let i=0;i<history.length;i+=2){
  rows.push((Math.floor(i/2)+1)+'. '+history[i]+
   (history[i+1]?'  '+history[i+1]:''));
 }
 movesEl.textContent=rows.join(' | ');
}

function tapSquare(square){
 if(thinking||game.game_over()||pendingPromotion)return;

 if(modeEl.value==='ai'&&game.turn()==='b')return;

 const piece=game.get(square);

 if(selected){
  const possible=targets.filter(m=>m.to===square);

  if(possible.length){
   // اگر چند حرکت به خانه مقصد وجود داشته باشد و سرباز در حال ارتقا باشد،
   // کاربر باید نوع مهره را انتخاب کند.
   const promotionMove=possible.find(m=>m.promotion);

   if(promotionMove){
    pendingPromotion={from:selected,to:square,token:gameToken};
    showPromotionChoices(game.turn());
    return;
   }

   const result=game.move({from:selected,to:square});

   if(result){
    lastMove={from:result.from,to:result.to};
    selected=null;
    targets=[];
    render();
    afterHumanMove();
    return;
   }
  }
 }

 if(piece&&piece.color===game.turn()){
  selected=square;
  targets=game.moves({square:square,verbose:true});
 }else{
  selected=null;
  targets=[];
 }
 render();
}

function showPromotionChoices(color){
 const white=color==='w';
 const glyphs=white
  ?{q:'♕',r:'♖',b:'♗',n:'♘'}
  :{q:'♛',r:'♜',b:'♝',n:'♞'};

 document.getElementById('promoQ').textContent=glyphs.q;
 document.getElementById('promoR').textContent=glyphs.r;
 document.getElementById('promoB').textContent=glyphs.b;
 document.getElementById('promoN').textContent=glyphs.n;

 modal.style.display='flex';
}

document.querySelectorAll('.promo-btn').forEach(button=>{
 button.addEventListener('click',()=>{
  finishPromotion(button.dataset.piece);
 });
});

function finishPromotion(pieceType){
 if(!pendingPromotion)return;

 const pending=pendingPromotion;
 pendingPromotion=null;
 modal.style.display='none';

 if(pending.token!==gameToken){
  selected=null;
  targets=[];
  render();
  return;
 }

 const result=game.move({
  from:pending.from,
  to:pending.to,
  promotion:pieceType
 });

 selected=null;
 targets=[];

 if(result){
  lastMove={from:result.from,to:result.to};
  render();
  afterHumanMove();
 }else{
  render();
 }
}

function afterHumanMove(){
 if(!game.game_over()&&modeEl.value==='ai'&&game.turn()==='b'){
  thinking=true;
  updateStatus();
  const token=gameToken;
  setTimeout(()=>{
   if(token===gameToken&&thinking)aiMove(token);
  },350);
 }
}

const values={p:100,n:320,b:330,r:500,q:900,k:20000};

function evaluatePosition(){
 const position=game.board();
 let score=0;

 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   const p=position[r][c];
   if(!p)continue;

   let value=values[p.type];
   const advance=p.color==='w'?(6-r):(r-1);
   if(p.type==='p')value+=advance*8;

   // کنترل مرکز صفحه ارزش کوچکی دارد.
   if(c>=2&&c<=5&&r>=2&&r<=5)value+=8;

   score+=(p.color==='b'?value:-value);
  }
 }

 if(game.in_check())score+=(game.turn()==='w'?80:-80);
 return score;
}

/*
  کامپیوتر با بررسی چند حرکت آینده انتخاب می‌کند.
  این موتور آموزشی است و قدرتش با Stockfish برابر نیست.
*/
function minimax(depth,alpha,beta,maximizing){
 if(game.game_over()||depth===0)return evaluatePosition();

 const moves=game.moves({verbose:true});
 if(!moves.length)return evaluatePosition();

 if(maximizing){
  let best=-Infinity;
  for(const m of moves){
   game.move({from:m.from,to:m.to,promotion:m.promotion||'q'});
   const score=minimax(depth-1,alpha,beta,false);
   game.undo();
   best=Math.max(best,score);
   alpha=Math.max(alpha,best);
   if(beta<=alpha)break;
  }
  return best;
 }else{
  let best=Infinity;
  for(const m of moves){
   game.move({from:m.from,to:m.to,promotion:m.promotion||'q'});
   const score=minimax(depth-1,alpha,beta,true);
   game.undo();
   best=Math.min(best,score);
   beta=Math.min(beta,best);
   if(beta<=alpha)break;
  }
  return best;
 }
}

function aiMove(token){
 if(token!==gameToken||game.game_over()){
  thinking=false;
  render();
  return;
 }

 const moves=game.moves({verbose:true});
 if(!moves.length){
  thinking=false;
  render();
  return;
 }

 let best=-Infinity;
 let candidates=[];

 // عمق محدود برای تعادل سرعت و قدرت در موبایل
 for(const m of moves){
  game.move({from:m.from,to:m.to,promotion:m.promotion||'q'});
  const score=minimax(2,-Infinity,Infinity,false);
  game.undo();

  const adjusted=score+(Math.random()*8);
  if(adjusted>best){
   best=adjusted;
   candidates=[m];
  }else if(adjusted>=best-10){
   candidates.push(m);
  }
 }

 const chosen=candidates[Math.floor(Math.random()*candidates.length)]||moves[0];

 const result=game.move({
  from:chosen.from,
  to:chosen.to,
  promotion:chosen.promotion||'q'
 });

 if(result)lastMove={from:result.from,to:result.to};

 thinking=false;
 selected=null;
 targets=[];
 render();
}

function undoMove(){
 if(thinking||pendingPromotion||!game.history().length)return;

 game.undo();

 // در حالت کامپیوتر، حرکت قبلی انسان را هم برمی‌گردانیم.
 if(modeEl.value==='ai'&&game.history().length){
  game.undo();
 }

 const history=game.history({verbose:true});
 lastMove=history.length
  ?{from:history[history.length-1].from,to:history[history.length-1].to}
  :null;

 selected=null;
 targets=[];
 render();
}

function newGame(){
 gameToken++;
 game.reset();
 selected=null;
 targets=[];
 lastMove=null;
 thinking=false;
 pendingPromotion=null;
 modal.style.display='none';
 render();
}

document.getElementById('undoBtn').addEventListener('click',undoMove);
document.getElementById('newBtn').addEventListener('click',newGame);
modeEl.addEventListener('change',newGame);

render();
})();
</script>
</body>
</html>
